# nginx vhost for thor-wallet — serves the built SPA straight off disk.
#
# There is deliberately no proxy_pass here. This is a static bundle, so nginx
# reads dist/ directly and there is no upstream process to fall over. That is
# what makes a 502 impossible: nginx only emits 502 when it proxies to a
# backend that isn't answering. Do NOT put `vite preview` or `vite dev` behind
# this — they are dev servers, they die with the shell that started them, and
# that is what took the site down before.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/thor-wallet
#   sudo ln -sf /etc/nginx/sites-available/thor-wallet /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name thor-wallet.nextcodes.top;

    # Point at the dist/ produced by `npm run build`. Adjust if you check the
    # repo out somewhere else. nginx needs +x on every parent directory.
    root /var/www/thor-wallet/dist;
    index index.html;

    # React Router owns the URLs. Anything that isn't a real file falls back to
    # index.html so a hard refresh of /login or /new/bybit-light works.
    # This is the nginx equivalent of public/.htaccess, which Apache-only and
    # therefore inert on this server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything in assets/ (index-Dxr4zFjv.js and friends),
    # so the filename changes whenever the content does. Safe to cache forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy ships new hashed assets that
    # nobody's browser ever learns to ask for.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # The bundle is a client-side demo (see CLAUDE.md — src/lib/auth.js is not
    # real auth), but these cost nothing.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ /\. {
        deny all;
    }
}
